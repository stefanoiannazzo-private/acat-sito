# Pubblica la cartella site/ sull'hosting via FTP a ogni push su main che la modifica.
# Credenziali: GitHub > Settings > Secrets and variables > Actions
#   secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   variabile (facoltativa): FTP_DIR  cartella del sito sul server, es. "/" o "/www.tuodominio.it/"
#   variabile (facoltativa): FTP_PROTOCOL  "ftps" (consigliato) oppure "ftp"
name: Pubblica sul server

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla che le credenziali FTP ci siano
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Credenziali FTP non ancora impostate: nessuna pubblicazione."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Carica site/ via FTP
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./site/
          server-dir: ${{ vars.FTP_DIR || '/' }}
